services:
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/taskloom?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-changeme}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://localhost:3000
    ports:
      - '3000:3000'

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskloom
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # One-time setup: run migrations and seed
  migrate:
    build:
      context: .
      target: builder
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/taskloom?schema=public
    command: ["pnpm", "prisma", "db", "push"]
    profiles:
      - setup

  seed:
    build:
      context: .
      target: builder
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/taskloom?schema=public
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-serhat@taskloom.app}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-serhat}
    command: ["pnpm", "prisma", "db", "seed"]
    profiles:
      - setup

volumes:
  postgres-data:
